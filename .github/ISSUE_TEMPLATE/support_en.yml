name: "[EN] Support / Question"
description: Ask a question or request support for a mod
title: "[Question] "
labels: ["question"]
assignees:
  - kuramochia

body:
  - type: markdown
    attributes:
      value: |
        > ⚠️ **Note:** Issues without an attached game.log.txt will be closed without review.

  - type: input
    id: mod_name
    attributes:
      label: Mod name
      description: Enter the name of the mod your question is about
      placeholder: "e.g., Scania Custom Chrome Parts"
    validations:
      required: true

  - type: input
    id: mod_version
    attributes:
      label: Mod version
      description: Enter the mod version
      placeholder: "e.g., 1.0"
    validations:
      required: true

  - type: textarea
    id: question_content
    attributes:
      label: Question
      description: Explain your question or request in detail
      placeholder: Your question...
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Explain any relevant details or background
      placeholder: Details...
    validations:
      required: true

  - type: dropdown
    id: game_name
    attributes:
      label: Game
      description: Select the game you are using
      options:
        - Euro Truck Simulator 2
        - American Truck Simulator
    validations:
      required: true

  - type: input
    id: game_version_number
    attributes:
      label: Game version
      description: Enter the game version number
      placeholder: "e.g., 1.50.0.1s"
    validations:
      required: true

  - type: checkboxes
    id: game_log_attached
    attributes:
      label: game.log.txt attachment confirmation
      description: "⚠️ **Required** - Attach game.log.txt to this issue"
      options:
        - label: I have attached game.log.txt
          required: true

  - type: textarea
    id: game_log_content
    attributes:
      label: game.log.txt contents
      description: Drag and drop the game.log.txt file here, or click to select it
      placeholder: Paste or attach the log file here

  - type: textarea
    id: screenshot_video
    attributes:
      label: Screenshot / video
      description: If available, describe or attach screenshots or videos showing the situation (optional)
      placeholder: Describe the screenshot or video...

  - type: textarea
    id: tried_things
    attributes:
      label: Things you have tried
      description: Describe anything you have already tried or researched
      placeholder: Things you have tried...
    validations:
      required: true

  - type: textarea
    id: additional_info
    attributes:
      label: Additional information
      description: Include any other relevant information (optional)
      placeholder: Additional information...
